<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Barcode SKU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="scan-card">
            <div class="card-header">
                <p class="eyebrow">SIM Market</p>
                <h1>Scan Barcode SKU</h1>
                <p id="status" class="status-text">Klik tombol untuk memulai kamera.</p>
            </div>

            <button id="start-btn" type="button">Mulai Kamera</button>
            <div id="reader" class="reader-frame"></div>

            <div id="show" class="result-box">
                <h4>Hasil Scan</h4>
                <p id="result"></p>
            </div>

            <div id="detail-form" class="detail-form">
                <p class="helper-text">Isi detail barang sebelum diteruskan ke aplikasi.</p>
                <label class="detail-field">
                    <span>Keterangan barang</span>
                    <input id="item-note" type="text" placeholder="Contoh: stok masuk dari supplier" />
                </label>
                <label class="detail-field">
                    <span>Jumlah barang masuk</span>
                    <input id="item-qty" type="number" min="1" value="1" />
                </label>
                <button id="save-scan-btn" type="button">Simpan ke SKU</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="qr.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const showEl = document.getElementById('show');
        const resultEl = document.getElementById('result');
        const detailFormEl = document.getElementById('detail-form');
        const itemNoteInput = document.getElementById('item-note');
        const itemQtyInput = document.getElementById('item-qty');
        const saveScanBtn = document.getElementById('save-scan-btn');
        const SUPABASE_URL = 'https://mqfaueuimoasxoijcrek.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZiA3fC0I5v_LPcliHXTnWQ_S6C2MZ5D';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let scanner = null;
        let isScanning = false;
        let lastScannedSku = '';

        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#fda4af' : '#cbd5e1';
        }

        async function onScanSuccess(decodedText) {
            if (!decodedText) return;

            lastScannedSku = decodedText;
            showEl.style.display = 'block';
            detailFormEl.style.display = 'block';
            resultEl.textContent = decodedText;
            itemNoteInput.value = '';
            itemQtyInput.value = '1';
            localStorage.setItem('last_scanned_sku', decodedText);
            if (scanner) {
                try {
                    await scanner.stop();
                } catch (err) {
                    console.warn(err);
                }
            }
            setStatus('Barcode berhasil terbaca. Lengkapi data lalu simpan.');
        }

        function onScanFailure() {
            // biarkan kosong, agar pemindaian tetap berjalan
        }

        async function saveScanToSupabase() {
            const sku = (lastScannedSku || '').trim();
            if (!sku) {
                setStatus('Belum ada barcode yang dipindai.', true);
                return false;
            }

            const note = itemNoteInput.value.trim();
            const qty = parseInt(itemQtyInput.value, 10) || 1;
            const baseName = note ? `Produk ${sku} (${note})` : `Produk ${sku}`;

            try {
                const { data: existing, error: selectError } = await supabase
                    .from('master_stok')
                    .select('*')
                    .eq('id', sku)
                    .maybeSingle();

                if (selectError) throw selectError;

                if (existing) {
                    const nextQty = (Number(existing.qty) || 0) + qty;
                    const { error } = await supabase
                        .from('master_stok')
                        .update({
                            qty: nextQty,
                            nama: note ? `${existing.nama || baseName} (${note})` : existing.nama || baseName
                        })
                        .eq('id', existing.id)
                        .select()
                        .single();

                    if (error) throw error;
                } else {
                    const newProduct = {
                        id: sku,
                        nama: baseName,
                        kategori: 'Scan',
                        harga: 0,
                        qty
                    };

                    const { error } = await supabase.from('master_stok').insert([newProduct]).select().single();
                    if (error) throw error;
                }

                localStorage.setItem('last_scanned_sku', sku);
                localStorage.setItem('last_scanned_note', note);
                localStorage.setItem('last_scanned_qty', String(qty));
                localStorage.removeItem('pending_scan');
                setStatus('Data barang berhasil disimpan ke database Supabase.');
                return true;
            } catch (err) {
                console.error('Gagal menyimpan data scan ke Supabase:', err);
                localStorage.setItem('pending_scan', JSON.stringify({ sku, note, qty }));
                setStatus('Gagal menyimpan ke database. Data disimpan sementara di browser dan akan diproses saat aplikasi dibuka.', true);
                return false;
            }
        }

        async function startScanner() {
            if (isScanning) return;

            if (!window.Html5Qrcode) {
                setStatus('Pustaka scanner tidak tersedia.', true);
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('Browser ini tidak mendukung akses kamera.', true);
                return;
            }

            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                setStatus('Buka halaman ini lewat localhost atau HTTPS agar kamera aktif.', true);
                return;
            }

            startBtn.disabled = true;
            startBtn.textContent = 'Memulai...';
            setStatus('Meminta akses kamera...');

            try {
                scanner = new Html5Qrcode('reader');
                const config = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0,
                    disableFlip: false
                };

                await scanner.start({ facingMode: 'environment' }, config, onScanSuccess, onScanFailure);
                isScanning = true;
                setStatus('Arahkan kamera ke barcode.');
            } catch (err) {
                console.error(err);
                setStatus('Gagal membuka kamera: ' + (err?.message || err), true);
                if (scanner) {
                    try {
                        await scanner.clear();
                    } catch (clearErr) {
                        console.warn(clearErr);
                    }
                }
                scanner = null;
                isScanning = false;
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = 'Mulai Kamera';
            }
        }

        saveScanBtn.addEventListener('click', async () => {
            const saved = await saveScanToSupabase();
            if (saved) {
                window.location.href = '../index.html';
            }
        });

        startBtn.addEventListener('click', () => {
            startScanner();
        });

        window.addEventListener('load', () => {
            startScanner();
        });
    </script>
</body>
</html>
